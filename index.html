<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>VEX Override Selection 2026–2027</title>
  <meta name="description" content="Bản thử nghiệm chấm tuyển V5RC Override vòng trường" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" data-view="overview" aria-label="Về trang tổng quan">
      <span class="brand-mark">V5</span>
      <span><strong>VEX OVERRIDE</strong><small>Vòng tuyển cấp trường 2026–2027</small></span>
    </button>
    <nav aria-label="Điều hướng chính">
      <button class="nav-btn active" data-view="overview">Tổng quan</button>
      <button class="nav-btn" data-view="judging">Phỏng vấn & Robot</button>
      <button class="nav-btn" data-view="skills">Robot Skills</button>
      <button class="nav-btn" data-view="rubric">Rubric</button>
    </nav>
    <button class="session-pill" id="syncConfig" type="button" title="Cấu hình Google Apps Script"><span class="live-dot"></span><span id="saveStatus">Chưa kết nối Google Sheets</span></button>
  </header>

  <main>
    <section id="overview" class="view active"></section>
    <section id="judging" class="view"></section>
    <section id="skills" class="view"></section>
    <section id="rubric" class="view"></section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
